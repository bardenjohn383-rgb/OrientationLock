name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SM=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager 2>/dev/null | sort -V | tail -1)
          if [ -z "$SM" ]; then
            mkdir -p $ANDROID_HOME/cmdline-tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmd.zip
            unzip -q /tmp/cmd.zip -d $ANDROID_HOME/cmdline-tools
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
            SM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          fi
          yes | $SM --licenses > /dev/null 2>&1 || true
          $SM "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "$PWD/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: Extract project
        run: unzip -q OrientationLock.zip

      - name: Build
        working-directory: OrientationLock
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orientationlock-apk
          path: OrientationLock/app/build/outputs/apk/release/*.apk
